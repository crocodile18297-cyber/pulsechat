name: Build PulseChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web directory & Capacitor config
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.kotello.pulsechat",
            "appName": "PulseChat",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install Capacitor 6 & Add Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Generate Custom PulseChat App Icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'PY'
          import os, glob
          from PIL import Image, ImageDraw

          S = 512
          img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          px = img.load()
          for y in range(S):
              for x in range(S):
                  t = (x + y) / (2 * S)
                  r = int(79 + (6 - 79) * t)
                  g = int(70 + (182 - 70) * t)
                  b = int(229 + (212 - 229) * t)
                  px[x, y] = (r, g, b, 255)

          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, S-1, S-1], radius=128, fill=255)
          img.putalpha(mask)

          d = ImageDraw.Draw(img)
          # Speech bubble
          d.rounded_rectangle([120, 145, 392, 345], radius=52, fill=(255, 255, 255, 245))
          d.polygon([(155, 330), (130, 395), (215, 345)], fill=(255, 255, 255, 245))
          # Pulse wave inside bubble
          pts = [(155, 248), (195, 248), (220, 195), (255, 295), (288, 225), (315, 248), (355, 248)]
          d.line(pts, fill=(99, 102, 241, 255), width=22, joint="curve")
          # Gold sparkle dot
          d.ellipse([365, 95, 420, 150], fill=(251, 191, 36, 255))

          for folder in glob.glob("android/app/src/main/res/mipmap-*"):
              for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  fpath = os.path.join(folder, fname)
                  if os.path.exists(fpath):
                      cur = Image.open(fpath)
                      resized = img.resize(cur.size, Image.Resampling.LANCZOS)
                      resized.save(fpath, "PNG")
          print("Custom PulseChat launcher icons generated!")
          PY

      - name: Add Permissions & MediaProjection Service to Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n <uses-permission android:name="android.permission.CAMERA" />\n <uses-permission android:name="android.permission.RECORD_AUDIO" />\n <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />|' "$MANIFEST"
          sed -i 's|</application>| <service android:name=".ScreenCaptureService" android:foregroundServiceType="mediaProjection" android:exported="false" />\n </application>|' "$MANIFEST"

      - name: Add Native Android ScreenCaptureService & MainActivity Bridge
        run: |
          PKG_DIR="android/app/src/main/java/com/kotello/pulsechat"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/ScreenCaptureService.java"
          package com.kotello.pulsechat;

          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import java.io.ByteArrayOutputStream;
          import java.nio.ByteBuffer;

          public class ScreenCaptureService extends Service {
              public static volatile boolean isRunning = false;
              private MediaProjection projection;
              private VirtualDisplay virtualDisplay;
              private ImageReader imageReader;
              private Handler bgHandler;
              private HandlerThread bgThread;
              private long lastFrameMs = 0;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null || "STOP".equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  createNotificationChannel();
                  Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, "pulse_screen")
                      : new Notification.Builder(this);
                  Notification notif = nb.setContentTitle("PulseChat")
                      .setContentText("Идёт трансляция экрана")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .build();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(101, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(101, notif);
                  }

                  int resultCode = intent.getIntExtra("code", Activity.RESULT_CANCELED);
                  Intent data = intent.getParcelableExtra("data");
                  int targetH = intent.getIntExtra("quality", 1080);

                  MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  if (mpm != null && data != null) {
                      projection = mpm.getMediaProjection(resultCode, data);
                  }
                  if (projection == null) {
                      MainActivity.notifyReady(false);
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int h = Math.min(targetH, dm.heightPixels);
                  int w = Math.max(360, (int) ((float) dm.widthPixels * h / Math.max(1, dm.heightPixels)));
                  if (w % 2 != 0) w--;
                  if (h % 2 != 0) h--;

                  bgThread = new HandlerThread("ScreenCap");
                  bgThread.start();
                  bgHandler = new Handler(bgThread.getLooper());

                  final int capW = w;
                  final int capH = h;
                  imageReader = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2);
                  imageReader.setOnImageAvailableListener(reader -> {
                      long now = System.currentTimeMillis();
                      Image img = reader.acquireLatestImage();
                      if (img == null) return;
                      if (now - lastFrameMs < 75) { img.close(); return; }
                      lastFrameMs = now;
                      try {
                          Image.Plane[] planes = img.getPlanes();
                          ByteBuffer buffer = planes[0].getBuffer();
                          int pixelStride = planes[0].getPixelStride();
                          int rowStride = planes[0].getRowStride();
                          int rowPadding = rowStride - pixelStride * capW;
                          Bitmap bmp = Bitmap.createBitmap(capW + rowPadding / pixelStride, capH, Bitmap.Config.ARGB_8888);
                          bmp.copyPixelsFromBuffer(buffer);
                          Bitmap cropped = Bitmap.createBitmap(bmp, 0, 0, capW, capH);
                          bmp.recycle();
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          cropped.compress(Bitmap.CompressFormat.JPEG, 65, baos);
                          cropped.recycle();
                          String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                          MainActivity.sendFrame(b64);
                      } catch (Exception ignored) {
                      } finally {
                          img.close();
                      }
                  }, bgHandler);

                  virtualDisplay = projection.createVirtualDisplay("PulseScreen", capW, capH, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader.getSurface(), null, bgHandler);
                  isRunning = true;
                  MainActivity.notifyReady(true);
                  return START_NOT_STICKY;
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel("pulse_screen", "Screen Share", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              @Override
              public void onDestroy() {
                  isRunning = false;
                  if (virtualDisplay != null) { virtualDisplay.release(); virtualDisplay = null; }
                  if (imageReader != null) { imageReader.close(); imageReader = null; }
                  if (projection != null) { projection.stop(); projection = null; }
                  if (bgThread != null) { bgThread.quitSafely(); bgThread = null; }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.kotello.pulsechat;

          import android.app.Activity;
          import android.content.Intent;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static MainActivity instance;
              private static final Handler mainHandler = new Handler(Looper.getMainLooper());
              private ActivityResultLauncher<Intent> screenLauncher;
              private int pendingQuality = 1080;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = this;
                  screenLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                              Intent svc = new Intent(this, ScreenCaptureService.class);
                              svc.putExtra("code", result.getResultCode());
                              svc.putExtra("data", result.getData());
                              svc.putExtra("quality", pendingQuality);
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(svc);
                              } else {
                                  startService(svc);
                              }
                          } else {
                              notifyReady(false);
                          }
                      }
                  );
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new ScreenBridge(), "PulseNativeScreen");
                  }
              }

              public static void sendFrame(String b64) {
                  if (instance == null || instance.getBridge() == null) return;
                  WebView wv = instance.getBridge().getWebView();
                  if (wv == null) return;
                  mainHandler.post(() -> wv.evaluateJavascript("window.__onNativeScreenFrame&&window.__onNativeScreenFrame('" + b64 + "')", null));
              }

              public static void notifyReady(boolean ok) {
                  if (instance == null || instance.getBridge() == null) return;
                  WebView wv = instance.getBridge().getWebView();
                  if (wv == null) return;
                  mainHandler.post(() -> wv.evaluateJavascript("window.__onNativeScreenReady&&window.__onNativeScreenReady(" + ok + ")", null));
              }

              public class ScreenBridge {
                  @JavascriptInterface
                  public void startScreenShare(int quality) {
                      pendingQuality = quality;
                      mainHandler.post(() -> {
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                          if (mpm != null) screenLauncher.launch(mpm.createScreenCaptureIntent());
                          else notifyReady(false);
                      });
                  }

                  @JavascriptInterface
                  public void stopScreenShare() {
                      mainHandler.post(() -> stopService(new Intent(MainActivity.this, ScreenCaptureService.class)));
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload PulseChat APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
